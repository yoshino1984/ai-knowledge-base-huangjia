services:
  # 手动触发一次采集、分析、整理流水线。
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-knowledge-base:local
    profiles: ["manual"]
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=Asia/Shanghai
      - PYTHONPATH=/app
      - KB_PIPELINE_SOURCES=${KB_PIPELINE_SOURCES:-github,rss}
      - KB_PIPELINE_LIMIT=${KB_PIPELINE_LIMIT:-5}
    volumes:
      - ./project/knowledge:/app/project/knowledge
      - ./logs:/app/logs
    command:
      - python
      - -m
      - project.pipeline.pipeline
      - --sources
      - ${KB_PIPELINE_SOURCES:-github,rss}
      - --limit
      - ${KB_PIPELINE_LIMIT:-5}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 容器内冒烟测试：验证知识库检索模块能被正常导入和调用。
  smoke:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-knowledge-base:local
    profiles: ["manual"]
    environment:
      - TZ=Asia/Shanghai
      - PYTHONPATH=/app
    volumes:
      - ./project/knowledge:/app/project/knowledge
    command:
      - python
      - -c
      - |
        from project.bot.knowledge_bot import KnowledgeBot
        bot = KnowledgeBot("project/knowledge/articles")
        print(bot.handle_message("smoke", "/search agent")[:800])
