name: V4 Daily AI Knowledge Collection

# 每天 UTC 00:00（北京时间 08:00）自动采集
# 和 V2 的 workflow 错开 8 小时,避免同时 commit
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: project/requirements.txt

      - name: Install dependencies
        run: pip install -r project/requirements.txt

      - name: Run V4 pipeline (collect + analyze + organize)
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m project.pipeline.pipeline \
            --sources github,rss \
            --limit 20 \
            --verbose

      - name: Regenerate articles index.json
        run: |
          # Bot 读的入口文件——每次采集后重新生成保证和实际文件一致
          python3 <<'PY'
          import json, glob
          from pathlib import Path
          arts = []
          for f in sorted(glob.glob('project/knowledge/articles/2026-*.json')):
              try:
                  d = json.load(open(f))
                  arts.append({
                      'id': d.get('id'),
                      'title': d.get('title'),
                      'category': d.get('category') or d.get('analysis', {}).get('technical_category'),
                      'score': d.get('score'),
                  })
              except Exception as e:
                  print(f'skip {f}: {e}')
          json.dump(arts, open('project/knowledge/articles/index.json', 'w'),
                    indent=2, ensure_ascii=False)
          print(f'regenerated index: {len(arts)} items')
          PY

      - name: Show summary
        run: |
          echo "========== V4 采集结果 =========="
          ls project/knowledge/articles/ | wc -l
          echo "最近 5 个新文件:"
          ls -t project/knowledge/articles/2026-*.json 2>/dev/null | head -5
          echo "================================"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add project/knowledge/
          if git diff --staged --quiet; then
            echo "No new articles to commit"
          else
            COUNT=$(git diff --staged --name-only | grep -c 'project/knowledge/articles/2026' || true)
            git commit -m "chore(v4): daily collection - $COUNT new/updated articles [$(date -u +%Y-%m-%d)]"
            git push
          fi
